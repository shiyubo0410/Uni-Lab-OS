    module: unilabos.devices.wxf.workstation:WxfWorkstation
    status_types:
      is_connected: bool
      liquid_detected: bool
      rssi: int
    type: python
  config_info: []
  description: WXF 工作站（2台润泽注射泵 + 2个XKC液位传感器，共享RS485总线）
  displayname: wxf.workstation
  handles: []
  icon: ''
  init_param_enforce: {}
  init_param_schema:
    config:
      properties:
        baudrate:
          default: 9600
          type: integer
        poll_interval:
          default: 0.5
          type: number
        port:
          default: COM9
          type: string
        pump_addresses:
          items:
            type: string
          type: array
        pump_max_volume:
          default: 25.0
          type: number
        sensor_ids:
          items:
            type: integer
          type: array
        threshold:
          default: 0
          type: integer
        timeout:
          default: 3.0
          type: number
      required: []
      type: object
    data:
      properties:
        is_connected:
          type: boolean
        liquid_detected:
          type: boolean
        rssi:
          type: integer
      required:
      - is_connected
      - liquid_detected
      - rssi
      type: object
  version: 1.0.0
