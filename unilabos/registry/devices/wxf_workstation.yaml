          required:
          - goal
          title: execute_command_from_outer参数
          type: object
        type: UniLabJsonCommand
      continuous_monitor:
        feedback: {}
        goal:
          device_id: 1
          duration: 0
          interval: 0.5
          threshold: 0
        goal_default:
          device_id: 1
          duration: 0
          interval: 0.5
          threshold: 0
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 对指定传感器进行连续液位检测，达到阈值时自动停止
          properties:
            feedback: {}
            goal:
              properties:
                device_id:
                  default: 1
                  description: 传感器站号
                  type: integer
                duration:
                  default: 0
                  description: 持续时长（秒），0 = 无限运行直到检测到液位
                  type: integer
                interval:
                  default: 0.5
                  description: 检测间隔（秒）
                  type: number
                threshold:
                  default: 0
                  description: RSSI 阈值（大于此值判定有液，0 = 使用硬件检测）
                  type: integer
              required: []
              type: object
            result:
              type: boolean
          required:
          - goal
          title: continuous_monitor参数
          type: object
        type: UniLabJsonCommand
