  description: 润泽精密注射泵（wxf驱动），两台泵共享RS485串口，通过地址区分。支持注射泵柱塞控制、多口阀门切换、加液/加样操作。适用于精密液体输送、进样、流速控制等实验室自动化应用。
  displayname: pump_2
  handles:
