jingfeispectrometer_device:
  category:
  - workstation_guozhuji
  class:
    action_value_mappings:
      auto-calibrate:
        feedback: {}
        goal: {}
        goal_default:
          spectro_num: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                spectro_num:
                  description: 光谱仪通道号,默认使用实例的spectro_num
                  type: string
              required: []
              type: object
            result: {}
          required:
          - goal
          title: calibrate参数
          type: object
        type: UniLabJsonCommand
      auto-continuous_monitor_multi_wavelengths:
        feedback: {}
        goal: {}
        goal_default:
          calibration_file: null
          duration_sec: null
          interval_sec: 1
          spectro_num: null
          wavelengths: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                calibration_file:
                  description: 校准数据文件路径,默认使用脚本目录下的 calibration_data.json
                  type: string
                duration_sec:
                  description: 监测时长,单位秒(None表示无限监测,按Ctrl+C停止)
                  type: string
                interval_sec:
                  default: 1
                  description: 采样间隔,单位秒
                  type: string
                spectro_num:
                  description: 光谱仪通道号,默认使用实例的spectro_num
                  type: string
                wavelengths:
                  description: 波长列表,单位nm
                  type: string
              required:
              - wavelengths
              type: object
            result: {}
          required:
          - goal
          title: continuous_monitor_multi_wavelengths参数
          type: object
        type: UniLabJsonCommand
      auto-load_calibration:
        feedback: {}
        goal: {}
        goal_default:
          filepath: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                filepath:
                  description: 校准数据文件路径,默认使用脚本目录下的 calibration_data.json
                  type: string
              required: []
              type: object
            result: {}
          required:
          - goal
          title: load_calibration参数
          type: object
        type: UniLabJsonCommand
      auto-measure_absorbance_at_wavelength:
        feedback: {}
        goal: {}
        goal_default:
          spectro_num: null
          verbose: false
          wavelength: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                spectro_num:
                  description: 光谱仪通道号,默认使用实例的spectro_num
                  type: string
                verbose:
                  default: false
                  description: 是否打印详细信息
                  type: string
                wavelength:
                  description: 目标波长,单位nm
                  type: string
              required:
              - wavelength
              type: object
            result: {}
          required:
          - goal
          title: measure_absorbance_at_wavelength参数
          type: object
        type: UniLabJsonCommand
      auto-measure_absorbance_at_wavelengths:
        feedback: {}
        goal: {}
        goal_default:
          spectro_num: null
          verbose: false
          wavelengths: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                spectro_num:
                  description: 光谱仪通道号,默认使用实例的spectro_num
                  type: string
                verbose:
                  default: false
