              type: object
            result: {}
          required:
          - goal
          title: measure_absorbance_at_wavelengths参数
          type: object
        type: UniLabJsonCommand
      auto-save_calibration:
        feedback: {}
        goal: {}
        goal_default:
          filepath: null
          spectro_num: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                filepath:
                  description: 保存路径，默认使用脚本目录下的 calibration_data.json
                  type: string
                spectro_num:
                  description: 光谱仪通道号，默认使用实例的 spectro_num
                  type: string
              required: []
              type: object
            result: {}
          required:
          - goal
          title: save_calibration参数
          type: object
        type: UniLabJsonCommand
      auto-set_integration_time:
        feedback: {}
        goal: {}
        goal_default:
          time_ms: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                time_ms:
                  description: 积分时间,单位毫秒
                  type: string
              required:
              - time_ms
              type: object
            result: {}
          required:
          - goal
          title: set_integration_time参数
          type: object
        type: UniLabJsonCommand
      start:
        feedback: {}
        goal:
          duration_sec: 60.0
          interval_sec: 0.5
          string: ''
          wavelengths: '[280, 300, 400]'
        goal_default:
          duration_sec: 60.0
          interval_sec: 0.5
          string: ''
          wavelengths: '[280, 300, 400]'
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 连续监测多波长吸光度。自动从 calibration_data.json 加载零位和基线，无需重新校准。
          properties:
            feedback:
              title: MonitorMultiWavelengths_Feedback
            goal:
              properties:
                duration_sec:
                  default: 60.0
                  description: 监测总时长，单位秒（传 0 或 null 表示无限监测）
                  type: string
                interval_sec:
                  default: 0.5
                  description: 采样间隔，单位秒
                  type: string
                string:
                  default: ''
                  description: 可选，JSON 字符串格式的全参数输入，如果提供则优先解析
                  type: string
                wavelengths:
                  default: '[280, 300, 400]'
                  description: 波长列表，JSON 字符串格式，如 "[280, 300, 400]"，单位 nm
                  type: string
              required: []
              title: MonitorMultiWavelengths_Goal
              type: object
            result:
              title: MonitorMultiWavelengths_Result
              type: object
          required:
          - goal
          title: start参数
          type: object
        type: UniLabJsonCommand
    module: unilabos.devices.jingfei.Jingfei:JingfeiSpectrometer
    status_types: {}
    type: python
  config_info: []
  description: ''
  displayname: jingfeispectrometer_device
  handles: []
  icon: ''
  init_param_enforce: {}
  init_param_schema:
    config:
      properties:
        dll_name:
          default: FLA5000DLL.dll
          description: DLL文件名,默认为 FLA5000DLL.dll
          type: string
      required: []
      type: object
    data:
      properties: {}
      required: []
      type: object
  version: 1.0.0
