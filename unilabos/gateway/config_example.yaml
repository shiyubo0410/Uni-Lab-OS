  #   registry_class: motor.youling.yl42b   # 或 motor.youling.yl57b
  #   init:
  #     port: /dev/ttyUSB1
  #     baudrate: 115200
  #     device_id: 1            # Modbus 站号 (1-254), 多电机共线时改成不同值
  #     steps_per_rev: 1600     # 默认 1600，按驱动器实际细分写
  #     lead_mm: 4.0            # 丝杠导程 mm/圈，move_distance 用得到
  #   properties:
  #     - status                # STANDBY / RUNNING / COLLISION_STOP ...
  #     - actual_steps
  #     - actual_speed
  #     - current_ma
  #   poll_interval: 1.0
  #   report_unchanged: false

  # ----- 大龙搅拌器 (RS-232 / 9600 8N1) -----
  # - device_id: stirrer-001
  #   name: 大龙磁力搅拌器
  #   driver: unilabos.devices.heaterstirrer.dalong.HeaterStirrer_DaLong
  #   registry_class: heaterstirrer.dalong
